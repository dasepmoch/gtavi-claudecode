<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Map the ASS caption fonts used by gtavi-claudecode to fonts that ship on Linux. -->
  <alias binding="strong"><family>Arial Black</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Impact</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
